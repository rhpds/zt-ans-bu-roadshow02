---
site:
  title: Ansible Automation Roadshow - Scenario 02
  url: https://rhpds.github.io/zt-ans-bu-roadshow02
  start_page: modules::module-01.adoc

content:
  sources:
    - url: .
      start_path: content
      branches: [HEAD]

ui:
  bundle:
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/v0.0.1/ui-bundle.zip
    snapshot: true
  supplemental_files:
    - path: ./content/supplemental-ui
    - path: ./content/lib
    - path: .nojekyll
    - path: ui.yml
      contents: "static_files: [ .nojekyll ]"

runtime:
  cache_dir: ./.cache/antora

antora:
  extensions:
    - require: ./content/lib/dev-mode.js
      enabled: false

output:
  dir: ./www
